<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="نبض الوطن">
  <meta name="theme-color" content="#0e0f12">
  <title>نبض الوطن · صانع المنشورات</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Amiri:wght@700&family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0e0f12; --card: #16181d; --field: #1d2026; --line: #2b2f37;
      --text: #eef0f3; --muted: #8f96a0; --accent: #d9474b;
    }
    html, body { background: var(--bg); }
    body {
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 110px);
    }


    .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

    .topbar { display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px; }
    .brand { font-weight: 800; font-size: 21px; }
    .brand span { color: var(--accent); }
    .topbar small { color: var(--muted); font-size: 12px; }

    .preview { border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 14px 34px rgba(0,0,0,.55); }
    #stage { display: block; width: 100%; height: auto; }

    .media-row { display: flex; gap: 10px; }
    .pick {
      flex: 2; position: relative; overflow: hidden;
      border: 1.5px dashed #e05a5e; color: #ff7a7e; background: transparent;
      border-radius: 14px; padding: 13px; font-weight: 700; font-size: 15px; text-align: center;
    }
    .pick input { position: absolute; inset: 0; opacity: 0; font-size: 100px; }
    .ghost {
      flex: 1; border: 1px solid var(--line); background: var(--field); color: #cfd2d7;
      border-radius: 14px; padding: 13px; font: inherit; font-size: 15px;
    }

    .card {
      background: var(--card); border: 1px solid #1f2229; border-radius: 18px;
      padding: 16px; display: flex; flex-direction: column; gap: 13px;
    }
    .card h3 { font-size: 15px; color: var(--muted); font-weight: 700; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field > label { font-size: 14px; color: #d4d7dc; }

    input[type=text], textarea, select {
      width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 14px;
      color: var(--text); padding: 13px 14px; font-size: 16px; font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    select {
      background-image: linear-gradient(45deg, transparent 50%, #9aa0a8 50%), linear-gradient(135deg, #9aa0a8 50%, transparent 50%);
      background-position: 18px 55%, 12px 55%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-left: 34px;
    }
    textarea { min-height: 88px; resize: none; line-height: 1.6; }
    input::placeholder, textarea::placeholder { color: #666c76; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #4a6fa8; }

    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }

    .check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #e1e3e7; }
    .check input { width: 22px; height: 22px; accent-color: #3b82f6; flex: none; }
    .checks { display: flex; gap: 18px; flex-wrap: wrap; }

    input[type=range] { width: 100%; accent-color: var(--accent); height: 30px; }

    .tiles { display: flex; gap: 10px; }
    .tile {
      flex: 1; position: relative; min-height: 78px; overflow: hidden;
      border: 1.5px dashed #3a3f48; border-radius: 16px; background: var(--field);
      display: flex; align-items: center; justify-content: center; gap: 9px;
      font-weight: 700; font-size: 15px; color: #eef0f3;
    }
    .tile input { position: absolute; inset: 0; opacity: 0; font-size: 100px; z-index: 1; }
    .tile .thumb { width: 42px; height: 42px; border-radius: 10px; background: #fff center/contain no-repeat; display: none; flex: none; }
    .tile.has .thumb { display: block; }
    .tile.has { border-style: solid; border-color: #3b82f6; }
    .tile .x {
      position: absolute; top: 5px; left: 6px; z-index: 2; display: none;
      width: 26px; height: 26px; border-radius: 50%; border: none;
      background: #2c3038; color: #fff; font-size: 15px; line-height: 26px;
    }
    .tile.has .x { display: block; }

    .seg { display: flex; background: var(--field); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .seg button { flex: 1; padding: 13px 4px; background: none; border: none; color: #dfe2e6; font: inherit; font-size: 15px; }
    .seg button.on { background: #eef0f3; color: #111; font-weight: 700; }

    .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .sw { aspect-ratio: 1.5; border-radius: 12px; border: 2px solid transparent; }
    .sw.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
    .sw-names { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: -6px; }
    .sw-names span { text-align: center; font-size: 11px; color: var(--muted); }

    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px);
      background: rgba(14,15,18,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid #1f2229;
    }
    .bar .inner { max-width: 460px; margin: 0 auto; display: flex; gap: 10px; }
    .btn {
      border: none; border-radius: 16px; padding: 16px 10px; font: inherit;
      font-size: 17px; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:disabled { opacity: .55; }
    .btn-primary { flex: 2; background: var(--accent); }
    .btn-second { flex: 1.2; background: #24324a; color: #cfe0ff; }

    #srcVideo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; top: 0; left: 0; }

    /* نافذة النتيجة */
    #resultModal {
      display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,.92);
      flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px 16px;
    }
    #resultModal.open { display: flex; }
    #resultImg, #resultVideo { max-width: 100%; max-height: 62vh; border-radius: 12px; }
    .modal-hint { font-size: 13px; color: #aab0b8; text-align: center; }
    .modal-actions { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
    .modal-actions .btn { width: 100%; }
    .btn-share { background: #25a95a; }
    .btn-close { background: #2a2d34; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">نبض <span>الوطن</span></div>
      <small>صانع المنشورات الإخبارية</small>
    </div>

    <div class="preview"><canvas id="stage" width="720" height="900"></canvas></div>

    <div class="media-row">
      <label class="pick">📷 صورة أو فيديو<input type="file" id="mediaInput" accept="image/*,video/*"></label>
      <button class="ghost" id="removeMedia">إزالة</button>
    </div>

    <div class="card">
      <h3>النصوص</h3>
      <div class="field">
        <label>عنوان الهيدر</label>
        <input type="text" data-k="header">
      </div>
      <div class="field">
        <label>سطر تحت العنوان (اختياري)</label>
        <input type="text" data-k="sub" placeholder="مثال: الجمعة ١٠ أكتوبر">
      </div>
      <div class="field">
        <label>نص الخبر</label>
        <textarea data-k="headline"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label>نوع الخط</label>
          <select data-k="font">
            <option value="'Tajawal', sans-serif">تجوال</option>
            <option value="'Cairo', sans-serif">القاهرة</option>
            <option value="'Almarai', sans-serif">المرعي</option>
            <option value="'Amiri', serif">أميري</option>
          </select>
        </div>
        <div class="field">
          <label>حجم الخط (<span id="sizeVal">18</span>)</label>
          <input type="range" min="12" max="32" data-k="size">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>الشريط العاجل</h3>
      <div class="row">
        <div class="field">
          <label>الكلمة</label>
          <input type="text" data-k="badge">
        </div>
        <div class="field">
          <label>المكان</label>
          <select data-k="tickerPos">
            <option value="bottom">أسفل المنشور</option>
            <option value="top">أعلى المنشور</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>نص الشريط</label>
        <input type="text" data-k="ticker">
      </div>
      <label class="check"><input type="checkbox" data-k="moving"> نص متحرك (يظهر متحركاً في الفيديو)</label>
    </div>

    <div class="card">
      <h3>الشعار والتوقيع</h3>
      <div class="tiles">
        <label class="tile" id="logoTile">
          <span class="thumb"></span>⭕ شعار الحساب
          <input type="file" accept="image/*" id="logoInput">
          <button class="x" type="button" data-clear="logo">✕</button>
        </label>
        <label class="tile" id="sponsorTile">
          <span class="thumb"></span>🏷️ شعار الراعي
          <input type="file" accept="image/*" id="sponsorInput">
          <button class="x" type="button" data-clear="sponsorLogo">✕</button>
        </label>
      </div>
      <div class="field">
        <label>العبارة بجانب الشعار</label>
        <input type="text" data-k="caption">
      </div>
      <div class="field">
        <label>اسم الراعي (إن لم يوجد شعار)</label>
        <input type="text" data-k="sponsorName" placeholder="مثال: معرض السيارات">
      </div>
    </div>

    <div class="card">
      <h3>الشكل</h3>
      <div class="seg" id="ratioSeg">
        <button data-r="4:5">منشور 4:5</button>
        <button data-r="1:1">مربع 1:1</button>
        <button data-r="9:16">ستوري 9:16</button>
      </div>
      <div class="swatches" id="swatches"></div>
      <div class="sw-names" id="swNames"></div>
      <div class="checks">
        <label class="check"><input type="checkbox" data-k="watermark"> نقش الشعار في الخلفية</label>
        <label class="check"><input type="checkbox" data-k="dark"> لوحة داكنة</label>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="inner">
      <button class="btn btn-primary" id="saveImage">حفظ الصورة</button>
      <button class="btn btn-second" id="saveVideo">🎬 فيديو</button>
    </div>
  </div>

  <video id="srcVideo" playsinline muted loop></video>

  <div id="resultModal">
    <img id="resultImg" alt="التصميم">
    <video id="resultVideo" controls playsinline loop style="display:none;"></video>
    <div class="modal-hint" id="modalHint"></div>
    <div class="modal-actions">
      <button class="btn btn-share" id="modalShare">📲 مشاركة / حفظ</button>
      <button class="btn btn-close" id="modalClose">إغلاق</button>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const TAJ = "'Tajawal', sans-serif";

    // ===== الإعدادات (تُحفظ في الجهاز) =====
    const DEFAULTS = {
      header: 'نبض الوطن',
      sub: '',
      headline: 'عاجل 🌧️ أمطار غزيرة متوقعة على عدد من محافظات السلطنة خلال الأيام القادمة، والأرصاد تدعو إلى أخذ الحيطة والحذر',
      font: "'Tajawal', sans-serif",
      size: 18,
      badge: 'عاجل',
      tickerPos: 'bottom',
      ticker: 'الأرصاد العُمانية: تأثر السلطنة بحالة مدارية خلال الأيام القادمة ◆ تعليق الدراسة في بعض المحافظات',
      moving: true,
      caption: 'الخبر العُماني بأدق تفاصيله',
      sponsorName: '',
      ratio: '4:5',
      theme: 'watani',
      watermark: true,
      dark: false,
      logo: null,
      sponsorLogo: null
    };

    const THEMES = {
      watani:   { name: 'وطني',  grad: ['#c62828', '#e07a3a', '#3f8f4a'], badge: '#b71c1c', badgeText: '#ffffff', tickerText: '#ffffff', accent: '#e53935', ring: '#2e7d4f' },
      gold:     { name: 'ذهبي',  grad: ['#a8781f', '#d9b354', '#f2dd9c'], badge: '#4a3208', badgeText: '#f6dd97', tickerText: '#2a1a02', accent: '#d4a843', ring: '#c39a36' },
      blue:     { name: 'أزرق',  grad: ['#143e72', '#2f74c0', '#6fbfe6'], badge: '#0b2a52', badgeText: '#ffffff', tickerText: '#ffffff', accent: '#4a9ae8', ring: '#2f74c0' },
      emerald:  { name: 'زمردي', grad: ['#0b4d3c', '#13896a', '#4fc59a'], badge: '#073a2d', badgeText: '#ffffff', tickerText: '#ffffff', accent: '#25b585', ring: '#13896a' },
      maroon:   { name: 'عنابي', grad: ['#4a0f1c', '#8c1d33', '#c8506a'], badge: '#2e0811', badgeText: '#f6cbd4', tickerText: '#ffffff', accent: '#e05570', ring: '#8c1d33' },
      charcoal: { name: 'فحمي',  grad: ['#1b1b1b', '#4a4a4a', '#8d8d8d'], badge: '#d32f2f', badgeText: '#ffffff', tickerText: '#ffffff', accent: '#f1f1f1', ring: '#555555' }
    };

    const STORE = 'nabd_settings_v2';
    let S = Object.assign({}, DEFAULTS);
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (saved) S = Object.assign({}, DEFAULTS, saved);
    } catch (e) {}
    if (!THEMES[S.theme]) S.theme = 'watani';

    function save() {
      try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {}
    }

    let dirty = true;
    const touch = () => { dirty = true; };

    // ===== أدوات الرسم =====
    function wrapLines(ctx, text, maxW) {
      const out = [];
      text.split('\n').forEach(par => {
        const words = par.split(/\s+/).filter(Boolean);
        if (!words.length) return;
        let line = words[0];
        for (let i = 1; i < words.length; i++) {
          const test = line + ' ' + words[i];
          if (ctx.measureText(test).width <= maxW) line = test;
          else { out.push(line); line = words[i]; }
        }
        out.push(line);
      });
      return out.length ? out : [''];
    }

    function fitText(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawCover(ctx, src, iw, ih, x, y, w, h) {
      if (!iw || !ih) return;
      const s = Math.max(w / iw, h / ih);
      const sw = w / s, sh = h / s;
      ctx.drawImage(src, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
    }

    function drawContain(ctx, img, x, y, w, h) {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      if (!iw || !ih) return;
      const s = Math.min(w / iw, h / ih);
      const dw = iw * s, dh = ih * s;
      ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    }

    function themeGrad(ctx, W, th) {
      const g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, th.grad[0]);
      g.addColorStop(0.5, th.grad[1]);
      g.addColorStop(1, th.grad[2]);
      return g;
    }

    function loadImage(url) {
      return new Promise(resolve => {
        if (!url) return resolve(null);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    const logoLetter = () => (S.header.trim()[0] || 'ن');

    // ===== حساب أبعاد التصميم =====
    function heightFor(W) {
      if (S.ratio === '1:1') return W;
      if (S.ratio === '9:16') return Math.round(W * 16 / 9);
      return Math.round(W * 5 / 4);
    }

    function layout(W, H) {
      const u = W / 1080;
      const c = document.createElement('canvas').getContext('2d');
      c.direction = 'rtl';

      const headerH = (S.sub.trim() ? 150 : 120) * u;
      const tickerH = 92 * u;
      const padX = 60 * u, pt = 46 * u, gap = 30 * u, footerH = 104 * u, pb = 40 * u;
      const fsBase = S.size * (1080 / 420) * u;
      const text = S.headline.trim() || 'اكتب نص الخبر...';

      let fs = fsBase, lines, lineH, panelH;
      for (let i = 0; i < 14; i++) {
        c.font = `800 ${fs}px ${S.font}`;
        lines = wrapLines(c, text, W - padX * 2);
        lineH = fs * 1.55;
        panelH = pt + lines.length * lineH + gap + footerH + pb;
        if (H - headerH - tickerH - panelH >= H * 0.3 || fs <= fsBase * 0.55) break;
        fs *= 0.92;
      }

      const mediaH = Math.max(0, H - headerH - tickerH - panelH);
      let tickerY, mediaY;
      if (S.tickerPos === 'top') { tickerY = headerH; mediaY = headerH + tickerH; }
      else { mediaY = headerH; tickerY = H - tickerH; }
      const panelY = mediaY + mediaH;

      c.font = `700 ${36 * u}px ${TAJ}`;
      const badgeW = c.measureText(S.badge.trim() || 'عاجل').width + 60 * u;
      c.font = `700 ${38 * u}px ${TAJ}`;
      const tickerText = S.ticker.trim();
      const seg = tickerText + '        ';
      const segW = Math.max(50 * u, c.measureText(seg).width);

      return { W, H, u, headerH, tickerH, tickerY, mediaY, mediaH, panelY, panelH,
               padX, pt, footerH, pb, fs, lines, lineH, badgeW, tickerText, seg, segW };
    }

    // ===== رسم التصميم =====
    function draw(ctx, L, media, t) {
      const { W, H, u } = L;
      const th = THEMES[S.theme];
      ctx.save();
      ctx.direction = 'rtl';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#101114';
      ctx.fillRect(0, 0, W, H);

      // الهيدر
      const sub = S.sub.trim();
      ctx.textAlign = 'center';
      ctx.fillStyle = th.accent;
      ctx.font = `800 ${54 * u}px ${TAJ}`;
      ctx.fillText(fitText(ctx, S.header, W - 80 * u), W / 2, sub ? 62 * u : L.headerH / 2);
      if (sub) {
        ctx.fillStyle = '#9aa0a6';
        ctx.font = `500 ${28 * u}px ${TAJ}`;
        ctx.fillText(fitText(ctx, sub, W - 80 * u), W / 2, 112 * u);
      }
      ctx.fillStyle = themeGrad(ctx, W, th);
      ctx.fillRect(0, L.headerH - 6 * u, W, 6 * u);

      // الصورة أو الفيديو
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, L.mediaY, W, L.mediaH);
      ctx.clip();
      if (media && media.w()) {
        drawCover(ctx, media.src, media.w(), media.h(), 0, L.mediaY, W, L.mediaH);
        const sh = ctx.createLinearGradient(0, L.mediaY + L.mediaH * 0.7, 0, L.mediaY + L.mediaH);
        sh.addColorStop(0, 'rgba(0,0,0,0)');
        sh.addColorStop(1, 'rgba(0,0,0,0.28)');
        ctx.fillStyle = sh;
        ctx.fillRect(0, L.mediaY, W, L.mediaH);
      } else {
        const pg = ctx.createLinearGradient(0, L.mediaY, 0, L.mediaY + L.mediaH);
        pg.addColorStop(0, '#24272e');
        pg.addColorStop(1, '#16181c');
        ctx.fillStyle = pg;
        ctx.fillRect(0, L.mediaY, W, L.mediaH);
        ctx.fillStyle = '#727984';
        ctx.font = `500 ${36 * u}px ${TAJ}`;
        ctx.textAlign = 'center';
        ctx.fillText('📷 ارفع صورة أو فيديو', W / 2, L.mediaY + L.mediaH / 2);
      }
      ctx.restore();

      // لوحة الخبر
      const dark = S.dark;
      ctx.fillStyle = dark ? '#15171c' : '#ffffff';
      ctx.fillRect(0, L.panelY, W, L.panelH);

      if (S.watermark) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, L.panelY, W, L.panelH);
        ctx.clip();
        ctx.globalAlpha = dark ? 0.08 : 0.06;
        const sz = L.panelH * 0.95;
        const cx = W / 2, cy = L.panelY + L.panelH / 2;
        if (logoImg) {
          drawContain(ctx, logoImg, cx - sz / 2, cy - sz / 2, sz, sz);
        } else {
          ctx.fillStyle = th.accent === '#f1f1f1' ? '#888' : th.accent;
          ctx.font = `800 ${sz * 0.85}px ${TAJ}`;
          ctx.textAlign = 'center';
          ctx.fillText(logoLetter(), cx, cy);
        }
        ctx.restore();
      }

      ctx.textAlign = 'center';
      ctx.fillStyle = dark ? '#ffffff' : '#121212';
      ctx.font = `800 ${L.fs}px ${S.font}`;
      const top = L.panelY + L.pt;
      L.lines.forEach((ln, i) => ctx.fillText(ln, W / 2, top + L.lineH * i + L.lineH / 2));

      drawFooter(ctx, L, th, dark);
      drawTicker(ctx, L, th, t);
      ctx.restore();
    }

    function drawFooter(ctx, L, th, dark) {
      const { W, u } = L;
      const cy = L.panelY + L.panelH - L.pb - L.footerH / 2;
      const d = 96 * u;
      const capColor = dark ? '#a9aeb5' : '#5f6368';
      const caption = S.caption.trim();
      const hasSponsor = !!(sponsorImg || S.sponsorName.trim());
      let circleX, capRight, capMax;

      ctx.font = `500 ${32 * u}px ${TAJ}`;
      if (!hasSponsor) {
        const cw = caption ? Math.min(ctx.measureText(caption).width, W - 2 * L.padX - d - 22 * u) : 0;
        const total = d + (caption ? 22 * u + cw : 0);
        const start = (W - total) / 2;
        circleX = start + total - d / 2;
        capRight = circleX - d / 2 - 22 * u;
        capMax = cw;
      } else {
        circleX = W - L.padX - d / 2;
        capRight = circleX - d / 2 - 22 * u;
        let blockRight;
        const sx = L.padX;
        if (sponsorImg) {
          const h = 84 * u;
          const w = Math.min(230 * u, h * sponsorImg.naturalWidth / sponsorImg.naturalHeight);
          drawContain(ctx, sponsorImg, sx, cy - h / 2, w, h);
          ctx.font = `500 ${24 * u}px ${TAJ}`;
          ctx.fillStyle = capColor;
          ctx.textAlign = 'left';
          ctx.fillText('برعاية', sx + w + 14 * u, cy);
          blockRight = sx + w + 14 * u + ctx.measureText('برعاية').width;
        } else {
          ctx.font = `700 ${28 * u}px ${TAJ}`;
          ctx.fillStyle = dark ? '#e7e9ec' : '#333';
          ctx.textAlign = 'left';
          const txt = fitText(ctx, 'برعاية: ' + S.sponsorName.trim(), W * 0.38);
          ctx.fillText(txt, sx, cy);
          blockRight = sx + ctx.measureText(txt).width;
        }
        capMax = capRight - blockRight - 28 * u;
      }

      if (caption && capMax > 40 * u) {
        ctx.fillStyle = capColor;
        ctx.textAlign = 'right';
        ctx.font = `500 ${32 * u}px ${TAJ}`;
        ctx.fillText(fitText(ctx, caption, capMax), capRight, cy);
      }

      // دائرة الشعار
      ctx.save();
      ctx.beginPath();
      ctx.arc(circleX, cy, d / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      if (logoImg) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(circleX, cy, d / 2 - 5 * u, 0, Math.PI * 2);
        ctx.clip();
        const inner = d * 0.74;
        drawContain(ctx, logoImg, circleX - inner / 2, cy - inner / 2, inner, inner);
        ctx.restore();
      } else {
        ctx.fillStyle = th.accent === '#f1f1f1' ? '#b30000' : th.accent;
        ctx.font = `800 ${44 * u}px ${TAJ}`;
        ctx.textAlign = 'center';
        ctx.fillText(logoLetter(), circleX, cy + 2 * u);
      }
      ctx.lineWidth = 5 * u;
      ctx.strokeStyle = th.ring;
      ctx.beginPath();
      ctx.arc(circleX, cy, d / 2 - 2.5 * u, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawTicker(ctx, L, th, t) {
      const { W, u } = L;
      const y = L.tickerY, h = L.tickerH, mid = y + h / 2;
      ctx.fillStyle = themeGrad(ctx, W, th);
      ctx.fillRect(0, y, W, h);
      const shine = ctx.createLinearGradient(0, y, 0, y + h);
      shine.addColorStop(0, 'rgba(255,255,255,0.16)');
      shine.addColorStop(0.5, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine;
      ctx.fillRect(0, y, W, h);

      const bh = h - 26 * u;
      const bx = W - 18 * u - L.badgeW;
      const clipR = bx - 12 * u;

      if (L.tickerText) {
        ctx.font = `700 ${38 * u}px ${TAJ}`;
        ctx.fillStyle = th.tickerText;
        if (t === null) {
          ctx.textAlign = 'right';
          ctx.fillText(fitText(ctx, L.tickerText, clipR - 30 * u), clipR - 10 * u, mid + 2 * u);
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, y, clipR, h);
          ctx.clip();
          ctx.textAlign = 'left';
          const off = (t * 130 * u) % L.segW;
          for (let x = off - L.segW; x < clipR; x += L.segW) ctx.fillText(L.seg, x, mid + 2 * u);
          ctx.restore();
        }
      }

      ctx.fillStyle = th.badge;
      roundRect(ctx, bx, mid - bh / 2, L.badgeW, bh, 14 * u);
      ctx.fill();
      ctx.fillStyle = th.badgeText;
      ctx.textAlign = 'center';
      ctx.font = `700 ${36 * u}px ${TAJ}`;
      ctx.fillText(S.badge.trim() || 'عاجل', bx + L.badgeW / 2, mid + 2 * u);
    }

    // ===== الوسائط والشعارات =====
    const srcVideo = $('srcVideo');
    let mediaKind = null, mediaURL = null, mediaImg = null, mediaFile = null;
    let logoImg = null, sponsorImg = null;

    function previewMedia() {
      if (mediaKind === 'image' && mediaImg) return { src: mediaImg, w: () => mediaImg.naturalWidth, h: () => mediaImg.naturalHeight };
      if (mediaKind === 'video') return { src: srcVideo, w: () => srcVideo.videoWidth, h: () => srcVideo.videoHeight };
      return null;
    }

    $('mediaInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      clearMedia();
      mediaFile = file;
      mediaURL = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        mediaKind = 'video';
        srcVideo.src = mediaURL;
        srcVideo.muted = true;
        try { await srcVideo.play(); } catch (err) {}
      } else {
        mediaKind = 'image';
        mediaImg = await loadImage(mediaURL);
      }
      touch();
    });

    function clearMedia() {
      srcVideo.pause();
      srcVideo.removeAttribute('src');
      srcVideo.load();
      if (mediaURL) URL.revokeObjectURL(mediaURL);
      mediaKind = null; mediaURL = null; mediaImg = null; mediaFile = null;
      $('mediaInput').value = '';
      touch();
    }
    $('removeMedia').addEventListener('click', clearMedia);

    async function fileToLogo(file) {
      const url = URL.createObjectURL(file);
      const img = await loadImage(url);
      URL.revokeObjectURL(url);
      if (!img) return null;
      const s = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s));
      c.height = Math.max(1, Math.round(img.naturalHeight * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/png');
    }

    async function refreshLogos() {
      logoImg = await loadImage(S.logo);
      sponsorImg = await loadImage(S.sponsorLogo);
      [['logoTile', S.logo], ['sponsorTile', S.sponsorLogo]].forEach(([id, data]) => {
        const tile = $(id);
        tile.classList.toggle('has', !!data);
        tile.querySelector('.thumb').style.backgroundImage = data ? `url("${data}")` : '';
      });
      touch();
    }

    [['logoInput', 'logo'], ['sponsorInput', 'sponsorLogo']].forEach(([id, key]) => {
      $(id).addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        S[key] = await fileToLogo(file);
        e.target.value = '';
        save();
        refreshLogos();
      });
    });
    document.querySelectorAll('[data-clear]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        S[btn.dataset.clear] = null;
        save();
        refreshLogos();
      });
    });

    // ===== ربط الحقول =====
    document.querySelectorAll('[data-k]').forEach(el => {
      const k = el.dataset.k;
      if (el.type === 'checkbox') el.checked = !!S[k];
      else el.value = S[k];
      const ev = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
      el.addEventListener(ev, () => {
        S[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
        if (k === 'size') $('sizeVal').textContent = S.size;
        if (k === 'font') fontsReady().then(touch);
        save();
        touch();
      });
    });
    $('sizeVal').textContent = S.size;

    document.querySelectorAll('#ratioSeg button').forEach(b => {
      b.classList.toggle('on', b.dataset.r === S.ratio);
      b.addEventListener('click', () => {
        S.ratio = b.dataset.r;
        document.querySelectorAll('#ratioSeg button').forEach(x => x.classList.toggle('on', x === b));
        save();
        touch();
      });
    });

    Object.entries(THEMES).forEach(([key, th]) => {
      const b = document.createElement('button');
      b.className = 'sw' + (S.theme === key ? ' on' : '');
      b.style.background = `linear-gradient(90deg, ${th.grad.join(', ')})`;
      b.title = th.name;
      b.addEventListener('click', () => {
        S.theme = key;
        document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b));
        save();
        touch();
      });
      $('swatches').appendChild(b);
      const n = document.createElement('span');
      n.textContent = th.name;
      $('swNames').appendChild(n);
    });

    // ===== الخطوط =====
    function fontsReady() {
      if (!document.fonts) return Promise.resolve();
      return Promise.all([
        document.fonts.load(`800 40px ${S.font}`, 'عربي'),
        document.fonts.load(`800 40px ${TAJ}`, 'عربي'),
        document.fonts.load(`700 40px ${TAJ}`, 'عربي'),
        document.fonts.load(`500 40px ${TAJ}`, 'عربي')
      ]).catch(() => {});
    }
    fontsReady().then(touch);
    if (document.fonts) document.fonts.ready.then(touch);

    // ===== المعاينة الحية =====
    const stage = $('stage');
    const sctx = stage.getContext('2d');
    const t0 = performance.now();
    let PL = null;

    function loop() {
      const moving = S.moving && S.ticker.trim();
      if (dirty) {
        const W = 720, H = heightFor(W);
        if (stage.width !== W) stage.width = W;
        if (stage.height !== H) stage.height = H;
        PL = layout(W, H);
      }
      if (dirty || moving || mediaKind === 'video') {
        draw(sctx, PL, previewMedia(), moving ? (performance.now() - t0) / 1000 : null);
        dirty = false;
      }
      requestAnimationFrame(loop);
    }
    refreshLogos().then(() => requestAnimationFrame(loop));

    // ===== حفظ كصورة =====
    async function renderImage() {
      await fontsReady();
      const W = 1080, H = heightFor(W);
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      draw(c.getContext('2d'), layout(W, H), previewMedia(), null);
      const blob = await new Promise((res, rej) =>
        c.toBlob(b => b ? res(b) : rej(new Error('فشل إنشاء الصورة')), 'image/png'));
      return new File([blob], 'nabd-post.png', { type: 'image/png' });
    }

    // ===== حفظ كفيديو =====
    function pickMime() {
      if (!window.MediaRecorder) return null;
      const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
      return list.find(t => MediaRecorder.isTypeSupported(t)) || '';
    }

    async function renderVideo(btn, audioCtx) {
      const mime = pickMime();
      if (mime === null) throw new Error('متصفحك لا يدعم تسجيل الفيديو، حدّث نظام الآيفون.');
      await fontsReady();

      const W = 720, H = heightFor(W);
      const L = layout(W, H);
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      const ctx = c.getContext('2d');
      const moving = S.moving && !!S.ticker.trim();
      const speed = 130 * L.u;

      let media = null, vid = null, audioTrack = null, duration;

      if (mediaKind === 'video') {
        vid = document.createElement('video');
        vid.src = mediaURL;
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        vid.preload = 'auto';
        await new Promise((res, rej) => {
          vid.onloadedmetadata = res;
          vid.onerror = () => rej(new Error('تعذر قراءة الفيديو'));
        });
        if (audioCtx) {
          try {
            const node = audioCtx.createMediaElementSource(vid);
            const dest = audioCtx.createMediaStreamDestination();
            node.connect(dest);
            audioTrack = dest.stream.getAudioTracks()[0] || null;
          } catch (e) { audioTrack = null; }
        }
        if (!audioTrack) vid.muted = true;
        try { await vid.play(); } catch (e) { vid.muted = true; await vid.play(); }
        duration = Math.min(vid.duration || 15, 60);
        media = { src: vid, w: () => vid.videoWidth, h: () => vid.videoHeight };
      } else {
        media = previewMedia();
        const onePass = (L.segW + W) / speed;
        duration = moving ? Math.max(8, Math.min(30, onePass + 1)) : 6;
      }

      draw(ctx, L, media, moving ? 0 : null);
      const stream = c.captureStream(30);
      if (audioTrack) stream.addTrack(audioTrack);
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 5000000 } : undefined);
      const chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise(res => { rec.onstop = res; });

      rec.start(250);
      const start = performance.now();
      await new Promise(resolve => {
        function frame() {
          const t = (performance.now() - start) / 1000;
          draw(ctx, L, media, moving ? t : null);
          btn.textContent = '⏳ ' + Math.min(100, Math.round(t / duration * 100)) + '%';
          if (t >= duration || (vid && vid.ended)) resolve();
          else requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });

      rec.stop();
      if (vid) vid.pause();
      await stopped;
      stream.getTracks().forEach(tr => tr.stop());

      const type = (rec.mimeType || mime || 'video/mp4').split(';')[0];
      const ext = type.includes('webm') ? 'webm' : 'mp4';
      return new File([new Blob(chunks, { type })], 'nabd-post.' + ext, { type });
    }

    // ===== النتيجة والمشاركة =====
    const resultModal = $('resultModal');
    const resultImg = $('resultImg');
    const resultVideo = $('resultVideo');
    let readyFile = null, readyURL = null;

    function showResult(file) {
      if (readyURL) URL.revokeObjectURL(readyURL);
      readyFile = file;
      readyURL = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        resultImg.style.display = 'none';
        resultVideo.src = readyURL;
        resultVideo.style.display = 'block';
        $('modalHint').textContent = 'اضغط "مشاركة / حفظ" ثم اختر "حفظ الفيديو" أو التطبيق اللي تبغاه';
      } else {
        resultVideo.pause();
        resultVideo.removeAttribute('src');
        resultVideo.style.display = 'none';
        resultImg.src = readyURL;
        resultImg.style.display = 'block';
        $('modalHint').textContent = 'اضغط مطوّلاً على الصورة ← "حفظ في الصور"، أو استخدم زر المشاركة';
      }
      resultModal.classList.add('open');
    }

    async function busy(btn, job) {
      const old = btn.textContent;
      document.querySelectorAll('.bar .btn').forEach(b => b.disabled = true);
      btn.textContent = '⏳ لحظة...';
      try {
        showResult(await job());
      } catch (err) {
        alert('تعذر التجهيز: ' + (err && err.message ? err.message : err));
      } finally {
        document.querySelectorAll('.bar .btn').forEach(b => b.disabled = false);
        btn.textContent = old;
      }
    }

    $('saveImage').addEventListener('click', function () { busy(this, renderImage); });

    $('saveVideo').addEventListener('click', function () {
      let audioCtx = null;
      if (mediaKind === 'video') {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
          audioCtx.resume();
        } catch (e) { audioCtx = null; }
      }
      const btn = this;
      busy(btn, async () => {
        try { return await renderVideo(btn, audioCtx); }
        finally { if (audioCtx) audioCtx.close().catch(() => {}); }
      });
    });

    $('modalShare').addEventListener('click', async () => {
      if (!readyFile) return;
      if (navigator.canShare && navigator.canShare({ files: [readyFile] })) {
        try { await navigator.share({ files: [readyFile] }); }
        catch (err) { if (err.name !== 'AbortError') alert('تعذرت المشاركة: ' + err.message); }
        return;
      }
      const a = document.createElement('a');
      a.download = readyFile.name;
      a.href = readyURL;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    function closeModal() {
      resultModal.classList.remove('open');
      resultVideo.pause();
    }
    $('modalClose').addEventListener('click', closeModal);
    resultModal.addEventListener('click', e => { if (e.target === resultModal) closeModal(); });
  </script>
</body>
</html>
